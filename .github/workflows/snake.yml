name: Generate Full History Snake

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/all-time-contribution-snake
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/generate_full_history_snake.py"
      - "tests/test_full_history_snake.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate generator
        run: |
          python -m py_compile scripts/generate_full_history_snake.py
          python -m unittest discover -s tests -p "test_full_history_snake.py" -v

      - name: Generate all historical contribution years
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_full_history_snake.py

      - name: Commit updated SVGs
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: "chore: refresh full GitHub contribution history snake"
          add: "dist/github-contribution-grid-snake*.svg"
